<div class="relative">

  <table [dataSource]="data()" class="mat-shadow-2" mat-table>

    @for (column of columns(); track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th *matHeaderCellDef class="text-[#6272A4] text-xl" mat-header-cell>
          {{ column.label }}
        </th>

        <td *matCellDef="let hero" class="text-[#F8F8F2]" mat-cell>
          {{ hero?.[column.key] }}
        </td>
      </ng-container>
    }

    <ng-container matColumnDef="actions">
      <th *matHeaderCellDef class="text-[#6272A4] text-xl" mat-header-cell>
        Acciones
      </th>

      <td *matCellDef="let hero" mat-cell>
        <button
          (click)="edit.emit(hero)"
          class="text-[#50FA7B]"
          mat-button>
          Editar
        </button>

        <button
          (click)="delete.emit(hero)"
          class="text-[#FF5555]"
          mat-button>
          Eliminar
        </button>
      </td>
    </ng-container>

    <tr *matHeaderRowDef="displayedColumns()" mat-header-row></tr>
    <tr *matRowDef="let row; columns: displayedColumns();" mat-row></tr>

    <tr *matNoDataRow class="mat-row">
      <td [attr.colspan]="displayedColumns().length" class="mat-cell">
        {{ emptyDataMessage() }}
      </td>
    </tr>

  </table>

  <div class="flex items-center justify-end gap-4 mt-2">
    <mat-form-field appearance="outline" class="w-28 text-xs" subscriptSizing="dynamic">
      <mat-label>Ir a pág.</mat-label>
      <input
        (change)="onPageJump($event)"
        [max]="paginator.getNumberOfPages()"
        [value]="pageIndex() + 1"
        matInput
        min="1"
        type="number" />
    </mat-form-field>

    <mat-paginator
      #paginator
      (page)="pageChange.emit($event)"
      [length]="totalElements()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[5, 10, 20]"
      [pageSize]="pageSize()"
      [showFirstLastButtons]="true"
    >
    </mat-paginator>
  </div>
</div>
