<section class="flex flex-col gap-3">

  <hero-filter-input
    (query)="queryToSearch.set($event)"
    [debounceTime]="500"
    [labelInput]="'Nombre del Héroe'"
  />


  <hero-table
    (delete)="deleteHero($event)"
    (edit)="editHero($event)"
    (pageChange)="managePaginationEvents($event)"
    [columns]="columnsTable"
    [currentQuery]="this.queryToSearch()"
    [data]="heroListResource.hasValue() ? heroListResource.value().data : []"
    [displayedColumns]="[
      'id',
      'name',
      'realName',
      'power',
      'intelligence',
      'universe',
      'actions'
    ]"
    [isLoading]="false"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [totalElements]="heroListResource.hasValue() ? heroListResource.value().items : 0"
  />
</section>
