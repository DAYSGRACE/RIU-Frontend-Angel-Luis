<h2 mat-dialog-title>
  {{ data.title }}
</h2>

<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button [mat-dialog-close]="false" mat-button>
    Cancelar
  </button>

  <button [mat-dialog-close]="true" mat-flat-button>
    Confirmar
  </button>
</mat-dialog-actions>
